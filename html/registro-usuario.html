<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetCard – Registro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

<style>
/* shared.css */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: #f7faf9; }
.navbar {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
  background: #fff; padding: 16px 32px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  display: flex; align-items: center;
}
.nav-logo {
  font-size: 1.4rem; font-weight: 800; color: #2d6a4f;
  text-decoration: none; letter-spacing: 2px;
}

/* registro-usuario.css */
.auth-container {
  display: flex; min-height: 100vh; padding-top: 64px;
}
.auth-left {
  flex: 1; background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 40px; color: #fff; text-align: center;
  position: relative; overflow: hidden;
}
.auth-left::before {
  content: '🐾'; font-size: 160px; opacity: 0.1;
  position: absolute; top: 20px; right: -20px;
}
.auth-left h1 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
.auth-left p  { font-size: 1rem; opacity: 0.88; margin-bottom: 28px; max-width: 300px; line-height: 1.6; }
.hero-image   { width: 100%; max-width: 320px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }

.auth-right {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 40px 60px; overflow-y: auto;
}
.auth-card {
  width: 100%; max-width: 440px;
  background: #fff; border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07);
}
.card { border: 1px solid #e8efec; }
.auth-title {
  font-size: 1.5rem; font-weight: 700; color: #1a1a2e;
  margin-bottom: 24px; text-align: center;
}

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: #444; margin-bottom: 6px; }

.input-group {
  display: flex; align-items: center;
  border: 1.5px solid #dde3e0; border-radius: 10px;
  background: #f7faf9; overflow: hidden;
  transition: border-color 0.2s;
}
.input-group:focus-within { border-color: #2d6a4f; background: #fff; }
.input-group i { padding: 0 12px; color: #888; font-size: 0.9rem; }

.form-control {
  flex: 1; padding: 11px 12px 11px 0;
  border: none; outline: none;
  background: transparent; font-size: 0.95rem; color: #333;
  font-family: inherit;
}

.error {
  color: #c62828; font-size: 0.8rem; margin-top: 5px; display: none;
}

.checkbox-group { margin-top: 4px; }
.checkbox-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.9rem; color: #555; cursor: pointer;
}
.checkbox-label input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: #2d6a4f;
}

.btn { border: none; cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: #2d6a4f; color: #fff; border-radius: 10px; padding: 13px; font-size: 1rem; }
.btn-primary:hover { background: #1f4d38; }
.btn-primary:active { transform: scale(0.98); }
.btn-full { width: 100%; margin-top: 8px; }
.btn-loading { display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }

.auth-footer { text-align: center; margin-top: 18px; font-size: 0.9rem; color: #666; }
.auth-footer a { color: #2d6a4f; font-weight: 600; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }

.spinner {
  width: 18px; height: 18px;
  border: 3px solid rgba(255,255,255,.4);
  border-top: 3px solid white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.success-banner {
  background: #f0fff4; border: 1px solid #b2dfdb; color: #1b5e20;
  border-radius: 10px; padding: 12px 16px; font-size: 0.875rem;
  margin-bottom: 16px; display: none; text-align: center;
}

@media (max-width: 768px) {
  .auth-left { display: none; }
  .auth-right { padding: 24px 16px 48px; }
  .auth-card  { padding: 28px 20px; }
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="./inicio.html" class="nav-logo">PETCARD</a>
</nav>

<main class="auth-container">
  <div class="auth-left">
    <h1>Bienvenido a PetCard</h1>
    <p>Registra tu cuenta y comienza a cuidar a tus mascotas de la mejor manera.</p>
    <img src="https://images.unsplash.com/photo-1544568100-847a948585b9?w=500" alt="Mascota feliz" class="hero-image">
  </div>

  <div class="auth-right">
    <div class="auth-card card">

      <h2 class="auth-title">Crear Cuenta</h2>

      <div class="success-banner" id="success-banner"></div>

      <div class="form-group">
        <label>Nombre</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="error" id="error-nombre"></div>
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" class="form-control" id="apellido" placeholder="Tu apellido">
        </div>
        <div class="error" id="error-apellido"></div>
      </div>

      <div class="form-group">
        <label>Correo</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
        </div>
        <div class="error" id="error-email"></div>
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <div class="input-group">
          <i class="fas fa-phone"></i>
          <input type="tel" class="form-control" id="telefono" placeholder="300 000 0000">
        </div>
        <div class="error" id="error-telefono"></div>
      </div>

      <!-- Campos extra para poder iniciar sesión después -->
      <div class="form-group">
        <label>Tipo de documento</label>
        <div class="input-group" style="padding: 2px 0;">
          <i class="fas fa-id-card"></i>
          <select class="form-control" id="tipo-documento" style="padding: 10px 8px; background: transparent; border: none; outline: none; color: #333; cursor: pointer; font-family: inherit;">
            <option value="" disabled selected>Selecciona...</option>
            <option value="cc">Cédula de Ciudadanía</option>
            <option value="ce">Cédula de Extranjería</option>
            <option value="ti">Tarjeta de Identidad</option>
            <option value="pp">Pasaporte</option>
          </select>
        </div>
        <div class="error" id="error-tipo-doc"></div>
      </div>

      <div class="form-group">
        <label>Número de documento</label>
        <div class="input-group">
          <i class="fas fa-hashtag"></i>
          <input type="text" class="form-control" id="documento" placeholder="Número de documento">
        </div>
        <div class="error" id="error-documento"></div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="error" id="error-password"></div>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-control" id="confirm" placeholder="Repite tu contraseña">
        </div>
        <div class="error" id="error-confirm"></div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="terminos">
          Acepto términos y condiciones
        </label>
        <div class="error" id="error-terminos"></div>
      </div>

      <!-- ✅ CONEXIÓN: al hacer clic registra y redirige a login-usuario.html -->
      <button class="btn btn-primary btn-full" id="crear" onclick="handleRegistro()">Crear Cuenta</button>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a href="./login-usuario.html">Iniciar sesión</a>
      </p>

    </div>
  </div>
</main>

<script>
  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearFieldError(id) {
    const el = document.getElementById(id);
    el.textContent = '';
    el.style.display = 'none';
  }
  function clearAllErrors() {
    ['nombre','apellido','email','telefono','tipo-doc','documento','password','confirm','terminos']
      .forEach(id => clearFieldError('error-' + id));
    document.getElementById('success-banner').style.display = 'none';
  }

  function handleRegistro() {
    clearAllErrors();

    const nombre    = document.getElementById('nombre').value.trim();
    const apellido  = document.getElementById('apellido').value.trim();
    const email     = document.getElementById('email').value.trim();
    const telefono  = document.getElementById('telefono').value.trim();
    const tipoDoc   = document.getElementById('tipo-documento').value;
    const documento = document.getElementById('documento').value.trim();
    const password  = document.getElementById('password').value;
    const confirm   = document.getElementById('confirm').value;
    const terminos  = document.getElementById('terminos').checked;

    let valid = true;

    if (!nombre) { showFieldError('error-nombre', 'El nombre es obligatorio.'); valid = false; }
    if (!apellido) { showFieldError('error-apellido', 'El apellido es obligatorio.'); valid = false; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('error-email', 'Ingresa un correo válido.'); valid = false;
    }
    if (!telefono || !/^\d{7,15}$/.test(telefono.replace(/\s/g,''))) {
      showFieldError('error-telefono', 'Ingresa un teléfono válido (solo números).'); valid = false;
    }
    if (!tipoDoc) { showFieldError('error-tipo-doc', 'Selecciona un tipo de documento.'); valid = false; }
    if (!documento || documento.length < 4) {
      showFieldError('error-documento', 'Ingresa un número de documento válido.'); valid = false;
    }
    if (!password || password.length < 6) {
      showFieldError('error-password', 'La contraseña debe tener al menos 6 caracteres.'); valid = false;
    }
    if (password !== confirm) {
      showFieldError('error-confirm', 'Las contraseñas no coinciden.'); valid = false;
    }
    if (!terminos) {
      showFieldError('error-terminos', 'Debes aceptar los términos y condiciones.'); valid = false;
    }

    if (!valid) return;

    // Verificar si el documento ya está registrado
    const usuarios = JSON.parse(localStorage.getItem('petcard_usuarios') || '[]');
    const existe = usuarios.find(u => u.documento === documento && u.tipoDocumento === tipoDoc);
    if (existe) {
      showFieldError('error-documento', 'Este documento ya está registrado. Intenta iniciar sesión.');
      return;
    }

    // Guardar usuario
    const nuevoUsuario = { nombre, apellido, email, telefono, tipoDocumento: tipoDoc, documento, password };
    usuarios.push(nuevoUsuario);
    localStorage.setItem('petcard_usuarios', JSON.stringify(usuarios));

    // Mostrar éxito y redirigir al login
    const banner = document.getElementById('success-banner');
    banner.textContent = `¡Cuenta creada exitosamente! Redirigiendo al inicio de sesión...`;
    banner.style.display = 'block';

    const btn = document.getElementById('crear');
    btn.innerHTML = '<span class="spinner"></span> Procesando...';
    btn.classList.add('btn-loading');

    setTimeout(() => {
      // ✅ CONEXIÓN: redirige a login-usuario.html
      window.location.href = './login-usuario.html';
    }, 1800);
  }

  // Permitir Enter para registrarse
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleRegistro();
  });
</script>
</body>
</html>
